
<!DOCTYPE html>
<html>
<head>
    <title>P&L History</title>
    <style>
        body { font-family: sans-serif; }
        .tab { overflow: hidden; border: 1px solid #ccc; background-color: #f1f1f1; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; }
        .tabcontent { display: none; padding: 6px 12px; border: 1px solid #ccc; border-top: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        td.profit { color: green; }
        td.loss { color: red; }
    </style>
</head>
<body>

<h1>P&L History</h1>

<div id="pnl-container">
    <!-- P&L data will be dynamically inserted here -->
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/pnl-data')
            .then(response => response.text())
            .then(text => {
                const cleanText = text.replace(/NaN/g, 'null');
                const data = JSON.parse(cleanText);
                const container = document.getElementById('pnl-container');

                for (const expiryDate in data) {
                    const trades = data[expiryDate];

                    const expiryHeader = document.createElement('h2');
                    expiryHeader.textContent = `Expiry: ${expiryDate}`;
                    container.appendChild(expiryHeader);

                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    const tbody = document.createElement('tbody');

                    // --- Header ---
                    const headerRow = document.createElement('tr');
                    const tradeDateHeader = document.createElement('th');
                    tradeDateHeader.textContent = 'Trade Date';
                    headerRow.appendChild(tradeDateHeader);

                    const strikeHeader = document.createElement('th');
                    strikeHeader.textContent = 'Strike';
                    headerRow.appendChild(strikeHeader);

                    let pnlDates = new Set();
                    trades.forEach(trade => {
                        Object.keys(trade).forEach(key => {
                            if (!['expiry_date', 'trade_date', 'strike_price', 'buy_price', 'call_id', 'put_id'].includes(key)) {
                                pnlDates.add(key);
                            }
                        });
                    });
                    const sortedPnlDates = Array.from(pnlDates).sort();

                    sortedPnlDates.forEach(date => {
                        const th = document.createElement('th');
                        th.textContent = date;
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);

                    // --- Body ---
                    trades.forEach(trade => {
                        const tr = document.createElement('tr');
                        const tradeDateCell = document.createElement('td');
                        tradeDateCell.textContent = trade.trade_date;
                        tr.appendChild(tradeDateCell);

                        const strikeCell = document.createElement('td');
                        strikeCell.textContent = trade.strike_price;
                        tr.appendChild(strikeCell);

                        sortedPnlDates.forEach(pnlDate => {
                            const pnlCell = document.createElement('td');
                            const pnlValue = trade[pnlDate];

                            if (pnlValue !== undefined && pnlValue !== null) {
                                pnlCell.textContent = pnlValue;
                                pnlCell.className = pnlValue >= 0 ? 'profit' : 'loss';
                            } else {
                                pnlCell.textContent = '';
                            }
                            tr.appendChild(pnlCell);
                        });
                        tbody.appendChild(tr);
                    });

                    table.appendChild(thead);
                    table.appendChild(tbody);
                    container.appendChild(table);
                }
            })
            .catch(error => console.error('Error fetching P&L data:', error));
    });
</script>

</body>
</html>
